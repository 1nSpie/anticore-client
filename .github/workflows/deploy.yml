name: Build & deploy client

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* вшиваются в JS при сборке → берутся из
      # Settings → Secrets and variables → Actions → Variables (не секреты: они всё равно видны в браузере)
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
            NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY=${{ vars.NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
            NEXT_PUBLIC_S3_URL=${{ vars.NEXT_PUBLIC_S3_URL }}
            NEXT_PUBLIC_REACT_APP_YMAP_KEY=${{ vars.NEXT_PUBLIC_REACT_APP_YMAP_KEY }}
            SITE_LINK=${{ vars.SITE_LINK }}
            USE_YANDEX_METRICS=${{ vars.USE_YANDEX_METRICS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TAG
          script: |
            set -euo pipefail
            cd /opt/anticore
            sed -i "s/^CLIENT_TAG=.*/CLIENT_TAG=${TAG}/" .env.deploy
            docker compose --env-file .env.deploy pull client
            docker compose --env-file .env.deploy up -d --no-deps client
            docker image prune -f
